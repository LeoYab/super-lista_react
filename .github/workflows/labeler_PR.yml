name: Labeler PR
run-name: 🏷️ Apply Labels to PR
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  labeler:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Label PR
        uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.LABELER_TOKEN }}
          configuration-path: .github/labeler.yml