name: Build & Push Docker Image
run-name: 🐳 Build & Push Docker Image
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Install Jq
        run: sudo apt-get install jq -y

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Calculate new Docker tag
        id: calculate_tag
        run: |
          LAST_TAG=$(curl -s https://hub.docker.com/v2/repositories/${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}/tags/?page_size=5 | jq -r '.results[1].name' || echo "0.0")
          echo "Last tag: $LAST_TAG"
          MAJOR=$(echo "$LAST_TAG" | cut -d'.' -f1)
          NEW_MAJOR=$((MAJOR + 1))
          NEW_TAG="${NEW_MAJOR}.0"
          echo "Calculated new tag: $NEW_TAG"
          echo "NEW_TAG=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          build-args: |
            REACT_APP_FIREBASE_API_KEY=${{ secrets.REACT_APP_FIREBASE_API_KEY }}
            REACT_APP_FIREBASE_AUTH_DOMAIN=${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}
            REACT_APP_FIREBASE_DATABASE_URL=${{ secrets.REACT_APP_FIREBASE_DATABASE_URL }}
            REACT_APP_FIREBASE_PROJECT_ID=${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}
            REACT_APP_FIREBASE_STORAGE_BUCKET=${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}
            REACT_APP_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
            REACT_APP_FIREBASE_APP_ID=${{ secrets.REACT_APP_FIREBASE_APP_ID }}
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${{ steps.calculate_tag.outputs.NEW_TAG }}
            ${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:lts

      - name: Test Docker image
        run: |
          docker run -d -p 8080:80 ${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${{ steps.calculate_tag.outputs.NEW_TAG }}
          sleep 15
          curl -f http://localhost:8080 || { echo "The application didn't respond on port 8080"; exit 1; }
          echo "The application responds correctly on port 8080."

      - name: Push Docker image
        if: success()
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            REACT_APP_FIREBASE_API_KEY=${{ secrets.REACT_APP_FIREBASE_API_KEY }}
            REACT_APP_FIREBASE_AUTH_DOMAIN=${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}
            REACT_APP_FIREBASE_DATABASE_URL=${{ secrets.REACT_APP_FIREBASE_DATABASE_URL }}
            REACT_APP_FIREBASE_PROJECT_ID=${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}
            REACT_APP_FIREBASE_STORAGE_BUCKET=${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}
            REACT_APP_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
            REACT_APP_FIREBASE_APP_ID=${{ secrets.REACT_APP_FIREBASE_APP_ID }}
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${{ steps.calculate_tag.outputs.NEW_TAG }}
            ${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:lts

      - name: Trigger Jenkins deploy (staging)
        env:
          JENKINS_WEBHOOK_URL: ${{ secrets.JENKINS_WEBHOOK_URL }}
        run: |
          if [ -z "$JENKINS_WEBHOOK_URL" ]; then
            echo "::error::JENKINS_WEBHOOK_URL secret is not set. See CI/CD docs for setup."
            exit 1
          fi
          for i in {1..3}; do
            echo "Attempt $i to trigger Jenkins deploy..."
            curl -sS -X POST \
              "$JENKINS_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d '{"source":"github-actions","repo":"${{ github.repository }}","tag":"${{ steps.calculate_tag.outputs.NEW_TAG }}","lts":"true"}' && break || {
              if [ $i -lt 3 ]; then
                echo "Failed to trigger Jenkins, retrying in 10 sec."
                sleep 10
              else
                echo "Failed after $i attempts."
                exit 1
              fi
            }
          done

      - name: Cleanup old Docker Hub tags
        if: success()
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          REPO="${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}"
          KEEP=5
          TOKEN=$(curl -s -H "Content-Type: application/json" -X POST -d '{"username": "'"${{ vars.DOCKERHUB_USERNAME }}"'", "password": "'"$DOCKERHUB_TOKEN"'"}' https://hub.docker.com/v2/users/login/ | jq -r .token)
          ALL_TAGS=$(curl -s -H "Authorization: Bearer $TOKEN" "https://hub.docker.com/v2/repositories/$REPO/tags/?page_size=100" | jq -r '.results[].name')
          NUMERIC_SORTED=$(echo "$ALL_TAGS" | grep -v '^lts$' | sort -t. -k1,1nr)
          TO_DELETE=$(echo "$NUMERIC_SORTED" | tail -n +$((KEEP + 1)))
          if [ -z "$TO_DELETE" ]; then
            echo "Nothing to delete, only $(echo "$NUMERIC_SORTED" | wc -l) versioned tags exist."
          else
            echo "Keeping: lts + $(echo "$NUMERIC_SORTED" | head -n $KEEP | tr '\n' ' ')"
            echo "Deleting:"
            echo "$TO_DELETE"
            for TAG in $TO_DELETE; do
              curl -s -o /dev/null -w "Deleted $TAG -> %{http_code}\n" -X DELETE -H "Authorization: Bearer $TOKEN" "https://hub.docker.com/v2/repositories/$REPO/tags/$TAG/"
            done
          fi
